name: Profile stats

# Rebuilds assets/stats.svg and assets/languages.svg from the GitHub API.
on:
  schedule:
    - cron: "23 2 * * *" # daily, 07:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats.mjs"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate cards
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg assets/languages.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "Piyush Mali"
          git config user.email "191071905+piyushmali61@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git commit -m "chore: refresh profile stats"
          git push
