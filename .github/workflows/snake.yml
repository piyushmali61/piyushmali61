name: Contribution snake

# Draws the contribution graph as an animated snake and publishes it to the
# `output` branch, which the README links to.
on:
  schedule:
    - cron: "41 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#14171C,#2E1065,#5B21B6,#7C3AED,#C084FC
            dist/snake-light.svg?color_snake=#8B5CF6&color_dots=#EBEDF0,#EDE9FE,#C4B5FD,#A78BFA,#8B5CF6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
          author: Piyush Mali <191071905+piyushmali61@users.noreply.github.com>
          committer: Piyush Mali <191071905+piyushmali61@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
