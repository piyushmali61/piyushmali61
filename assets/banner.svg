<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t">
  <title id="t">Welcome to my GitHub. Piyush Mali, Full-Stack Developer. Building Ideas. Engineering Solutions. Delivering Impact.</title>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity=".09"/></pattern>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".5" stop-color="#C084FC" stop-opacity=".18"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".16"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1200" height="220" rx="14"/></clipPath>
  </defs>
  <style>
    .s{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .scan{animation:scan 4s linear infinite}@keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(240px)}}
    .blink{animation:b 1.6s steps(1) infinite}@keyframes b{50%{opacity:.15}}
    .glow{animation:gl 5s ease-in-out infinite}@keyframes gl{50%{opacity:.5}}
    .in{opacity:0;animation:in .8s ease-out forwards}.d2{animation-delay:.3s}.d3{animation-delay:.6s}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#0B0D10"/>
    <rect width="1200" height="220" fill="url(#g)"/>
    <rect class="glow" width="1200" height="220" fill="url(#glow)"/>
    <rect class="scan" width="1200" height="60" fill="url(#scan)"/>
  </g>
  <path d="M20 46V20h26M1154 20h26v26M1180 174v26h-26M46 200H20v-26" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <g class="m" font-size="11" fill="#A0A7B4" letter-spacing="2">
    <text x="40" y="44"><tspan class="blink" fill="#8B5CF6">●</tspan> SYS.ONLINE // WELCOME TO MY GITHUB</text>
    <text x="1160" y="44" text-anchor="end">JALGAON · IN</text>
    <text x="1160" y="186" text-anchor="end">REACT · NEXT.JS · TYPESCRIPT · NODE.JS</text>
    <text x="40" y="186">VP @ SSBT IGNITE E-CELL</text>
  </g>
  <text class="s in" x="600" y="112" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="8" fill="#F5F5F5">PIYUSH MALI</text>
  <text class="m in d2" x="600" y="142" text-anchor="middle" font-size="15" letter-spacing="3" fill="url(#a)">FULL-STACK DEVELOPER</text>
  <text class="s in d3" x="600" y="166" text-anchor="middle" font-size="13" fill="#A0A7B4">Building Ideas. Engineering Solutions. Delivering Impact.</text>
</svg>
